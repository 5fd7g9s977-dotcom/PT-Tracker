<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PT Exercise Tracker</title>
<style>
  :root{
    --bg:#f5f7fb;
    --panel:#ffffff;
    --text:#18202a;
    --muted:#64748b;
    --line:#d9e1ec;
    --shadow:0 10px 30px rgba(15, 23, 42, 0.08);
    --radius:18px;
    --today:#1f7ae0;
    --success:#218838;
    --warn:#d6a200;
    --danger:#d64545;
    --chip:#eaf0f8;
    --focus:#7aa8ff;
    --st:#60A8F0;
    --str:#70D090;
    --nerve:#D090F0;
    --cardio:#F08060;
    --decomp:#60D0E0;
    --phase2:#F0D060;
    --avoid:#E85A5A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Verdana,system-ui,-apple-system,Segoe UI,sans-serif}
  body{min-height:100vh}
  header.app-header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,rgba(245,247,251,.98),rgba(245,247,251,.92));
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(217,225,236,.8);
    padding:14px 16px 10px;
  }
  .header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .title-wrap h1{margin:0;font-size:1.25rem;line-height:1.1}
  .title-wrap p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
  .status-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-size:.88rem}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
  .dot.saved{background:var(--success)}
  .dot.busy{background:var(--warn)}
  nav.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 0}
  .tab-btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:11px 14px;border-radius:999px;cursor:pointer;min-height:44px;box-shadow:0 1px 0 rgba(255,255,255,.8) inset;font-weight:700;font-size:.93rem}
  .tab-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
  main{padding:14px 16px 28px;max-width:1450px;margin:0 auto}
  section.panel{display:none}
  section.panel.active{display:block}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
  .card h2,.card h3,.card h4{margin:0 0 10px}
  .subtle{color:var(--muted)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .spaced{justify-content:space-between}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:.82rem;font-weight:700}
  .chip.warn{background:#fff0f0;border-color:#f2b6b6;color:var(--danger)}
  .chip.stretch{background:rgba(96,168,240,.15);border-color:rgba(96,168,240,.35)}
  .chip.strength{background:rgba(112,208,144,.15);border-color:rgba(112,208,144,.35)}
  .chip.nerve{background:rgba(208,144,240,.15);border-color:rgba(208,144,240,.35)}
  .chip.cardio{background:rgba(240,128,96,.15);border-color:rgba(240,128,96,.35)}
  .chip.decompression{background:rgba(96,208,224,.18);border-color:rgba(96,208,224,.38)}
  .chip.phase2{background:rgba(240,208,96,.28);border-color:rgba(240,208,96,.55)}
  .chip.avoid{background:rgba(232,90,90,.15);border-color:rgba(232,90,90,.35)}
  .section-title{margin:0 0 12px;font-size:1.02rem}
  .btn{appearance:none;border:none;background:#243044;color:#fff;border-radius:12px;padding:11px 14px;cursor:pointer;min-height:44px;font-weight:700}
  .btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
  .btn.danger{background:var(--danger)}
  .btn.small{padding:8px 10px;min-height:36px;font-size:.88rem;border-radius:10px}
  .btn:focus,.tab-btn:focus,input:focus,select:focus,textarea:focus,summary:focus{outline:3px solid var(--focus);outline-offset:2px}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:#fff;color:var(--text)}
  textarea{min-height:92px;resize:vertical}
  label{display:block;font-size:.88rem;font-weight:700;margin:0 0 6px}
  .field{display:flex;flex-direction:column;gap:6px}
  .fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .fields.tight{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .muted{color:var(--muted)}
  .today-head{display:grid;gap:10px;grid-template-columns:1fr auto}
  .status-big{font-size:1.1rem;font-weight:800}
  .routine-item{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff;margin-bottom:10px}
  .routine-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
  .routine-name{font-weight:800;font-size:1rem}
  .routine-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .set-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .set-box{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fafcff}
  .set-box input{width:18px;height:18px;margin:0}
  details.guide{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
  details.guide summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px}
  details.guide summary::-webkit-details-marker{display:none}
  details.guide .guide-body{padding:0 14px 14px}
  .guide-body ul{margin:8px 0 0 20px;padding:0}
  .guide-body li{margin:6px 0}
  .library-search{position:sticky;top:90px;z-index:10;background:linear-gradient(180deg,var(--bg),rgba(245,247,251,.94));padding-bottom:10px}
  .cat-group{margin-bottom:16px}
  .exercise-card{padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff;margin-bottom:10px}
  .exercise-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .exercise-head h4{margin:0}
  .exercise-desc{margin:6px 0 0;color:var(--muted)}
  .guide-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:10px}
  .mini-box{background:#fafcff;border:1px solid var(--line);border-radius:14px;padding:10px}
  .mini-box h5{margin:0 0 6px;font-size:.88rem}
  .mini-box ul{margin:0 0 0 18px;padding:0}
  .mini-box li{margin:4px 0}
  .warning-banner{padding:10px 12px;border-radius:14px;background:#fff1f1;border:1px solid rgba(232,90,90,.35);color:#9b1c1c;font-weight:700}
  .two-col{display:grid;gap:14px;grid-template-columns:1.15fr .85fr}
  .form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .form-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .helper{font-size:.82rem;color:var(--muted)}
  .section-block{margin-bottom:18px}
  .exercise-list{display:grid;gap:10px}
  .routine-builder-item{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}
  .inline-actions{display:flex;gap:8px;flex-wrap:wrap}
  .modal-backdrop{position:fixed;inset:0;background:rgba(13,20,31,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal-backdrop.open{display:flex}
  .modal{width:min(1100px,100%);max-height:95vh;overflow:auto;background:#fff;border-radius:22px;border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.25);padding:16px}
  .modal-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
  .modal-header h3{margin:0}
  .calendar-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px}
  .day-head,.day-cell{min-height:84px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:8px}
  .day-head{min-height:auto;background:#eef3f8;font-weight:800;font-size:.82rem;text-align:center}
  .day-cell{cursor:pointer}
  .day-cell.empty{background:#f7f8fb;color:#a0a9b7;cursor:default}
  .day-cell .date{font-weight:800;margin-bottom:6px}
  .day-cell.full{background:rgba(33,136,56,.14);border-color:rgba(33,136,56,.3)}
  .day-cell.partial{background:rgba(214,162,0,.18);border-color:rgba(214,162,0,.32)}
  .day-cell.none{background:rgba(128,138,156,.10);border-color:rgba(128,138,156,.24)}
  .stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
  .stat .num{font-size:1.4rem;font-weight:900;margin-top:4px}
  .selected-log{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff}
  .footer-note{color:var(--muted);font-size:.82rem;margin-top:8px}
  .toast{position:fixed;right:16px;bottom:16px;z-index:80;background:#18202a;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.22s ease;pointer-events:none;max-width:min(92vw,420px)}
  .toast.show{opacity:1;transform:translateY(0)}
  @media (max-width: 900px){
    .two-col{grid-template-columns:1fr}
    .today-head{grid-template-columns:1fr}
    .calendar-grid{gap:6px}
    .day-head,.day-cell{min-height:70px;padding:7px}
  }
</style>
</head>
<body>
<header class="app-header">
  <div class="header-row">
    <div class="title-wrap">
      <h1>PT Exercise Tracker</h1>
      <p>Offline-first single-file tracker for routines, exercise detail, logs, and CSV export.</p>
    </div>
    <div class="status-pill" aria-live="polite"><span id="savedDot" class="dot"></span><span id="savedText">Loading…</span></div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab-btn active" data-tab="today">Today</button>
  <button class="tab-btn" data-tab="library">Library</button>
  <button class="tab-btn" data-tab="edit">Edit</button>
  <button class="tab-btn" data-tab="log">Log</button>
</nav>

<main>
  <section id="todayPanel" class="panel active"></section>
  <section id="libraryPanel" class="panel"></section>
  <section id="editPanel" class="panel"></section>
  <section id="logPanel" class="panel"></section>
</main>

<div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <div>
        <h3 id="modalTitle">Edit Exercise</h3>
        <div class="helper">Use one item per line for the list fields.</div>
      </div>
      <button class="btn secondary small" id="closeModalBtn" type="button">Close</button>
    </div>
    <form id="exerciseModalForm">
      <input type="hidden" name="id">
      <div class="fields">
        <div class="field">
          <label for="modalName">Name</label>
          <input id="modalName" name="name" required>
        </div>
        <div class="field">
          <label for="modalCategory">Category</label>
          <select id="modalCategory" name="category" required>
            <option>Stretch</option>
            <option>Strength</option>
            <option>Nerve</option>
            <option>Cardio</option>
            <option>Decompression</option>
            <option>Phase2</option>
            <option>Avoid</option>
          </select>
        </div>
      </div>
      <div class="field" style="margin-top:12px">
        <label for="modalDescription">Description</label>
        <textarea id="modalDescription" name="description" required></textarea>
      </div>
      <div class="fields" style="margin-top:12px">
        <div class="field">
          <label for="modalWhat">What to Feel</label>
          <textarea id="modalWhat" name="whatToFeel"></textarea>
        </div>
        <div class="field">
          <label for="modalProgression">Progression</label>
          <textarea id="modalProgression" name="progression"></textarea>
        </div>
      </div>
      <div class="field" style="margin-top:12px">
        <label for="modalNotes">Notes</label>
        <textarea id="modalNotes" name="notes"></textarea>
      </div>
      <div class="fields" style="margin-top:12px">
        <div class="field">
          <label for="modalTechnique">Technique (one line per step)</label>
          <textarea id="modalTechnique" name="technique"></textarea>
        </div>
        <div class="field">
          <label for="modalMistakes">Common Mistakes (one line per item)</label>
          <textarea id="modalMistakes" name="commonMistakes"></textarea>
        </div>
      </div>
      <div class="field" style="margin-top:12px">
        <label for="modalTags">Tags (comma separated)</label>
        <input id="modalTags" name="tags">
      </div>
      <div class="form-actions">
        <button class="btn" type="submit">Update Exercise</button>
        <button class="btn secondary" type="button" id="cancelModalBtn">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

function buildGuide(name, category){
  const cue = SPECIAL_CUES[name];
  if(cue){
    return { whatToFeel: cue.feel, technique: cue.steps, commonMistakes: cue.mistakes, progression: cue.progression, notes: cue.notes };
  }
  if(category === 'Phase2'){
    const p = PHASE2_CUES[name];
    return {
      whatToFeel: `${name} should feel like ${p.feel}. This is a Phase 2 exercise and requires prior Phase 1 mastery.`,
      technique: ['Set up so the first reps are controlled and repeatable.', p.step, 'Stop before trunk, pelvis, or knees drift out of position.', 'Reset and repeat with the same shape.'],
      commonMistakes: [p.bad, 'adding load before form is ready','rushing the tempo or using momentum'],
      progression: `${p.progression}.`,
      notes: `Phase 2 exercise. ${p.notes}`
    };
  }
  if(category === 'Avoid'){
    const a = AVOID_CUES[name];
    return {
      whatToFeel: `${name} tends to create ${a.feel}.`,
      technique: [a.step1, a.step2, 'The movement often becomes less clean as fatigue rises, which is why it is not used now.'],
      commonMistakes: [a.bad, 'treating the movement as harmless just because it feels familiar','ignoring symptoms during or after the session'],
      progression: a.progression,
      notes: a.notes
    };
  }
  return buildGenericGuide(name, category);
}

function enrichExercises(list){
  return list.map(ex => ({ ...ex, drillDown: ex.drillDown || buildGuide(ex.name, ex.category) }));
}

function ensureLibrarySeed(){
  const seeded = enrichExercises(BASE_EXERCISES);
  if(!Array.isArray(state.exercises) || !state.exercises.length){
    state.exercises = seeded;
    persist(false);
    return;
  }
  const seededById = new Map(seeded.map(ex => [ex.id, ex]));
  state.exercises = state.exercises.map(ex => {
    const seed = seededById.get(ex.id);
    return { ...ex, drillDown: ex.drillDown || seed?.drillDown || buildGuide(ex.name, ex.category) };
  });
}

function ensureTodayRoutine(){
  const d = todayISO();
  if(!state.routines[d]){
    state.routines[d] = { id:`routine-${d}`, date:d, exercises:[], completionStatus:'none', notes:'' };
    persist(false);
  }
  normalizeAllRoutines();
}

function normalizeAllRoutines(){
  Object.keys(state.routines).forEach(date => {
    const routine = state.routines[date];
    if(!routine || typeof routine !== 'object'){ delete state.routines[date]; return; }
    routine.id = routine.id || `routine-${date}`;
    routine.date = routine.date || date;
    routine.exercises = Array.isArray(routine.exercises) ? routine.exercises.map(normalizeRoutineExercise) : [];
    routine.notes = typeof routine.notes === 'string' ? routine.notes : '';
    routine.completionStatus = computeCompletionStatus(routine);
  });
}

function normalizeRoutineExercise(ex){
  const sets = Math.max(1, Number(ex.sets || 1));
  const completed = Array.from({length:sets}, (_, i) => Boolean(ex.completed && ex.completed[i]));
  return {
    exerciseId: ex.exerciseId,
    sets,
    reps: Math.max(0, Number(ex.reps || 0)),
    holdDuration: Math.max(0, Number(ex.holdDuration || 0)),
    holdRep: ex.holdRep === null || ex.holdRep === '' || Number.isNaN(Number(ex.holdRep)) ? null : Number(ex.holdRep),
    completed
  };
}

function computeCompletionStatus(routine){
  if(!routine || !routine.exercises || !routine.exercises.length) return 'none';
  const total = routine.exercises.reduce((sum, ex) => sum + (ex.sets || 0), 0);
  const done = routine.exercises.reduce((sum, ex) => sum + (ex.completed || []).filter(Boolean).length, 0);
  if(done === 0) return 'none';
  if(done === total) return 'full';
  return 'partial';
}

function persist(showToast = true){
  try{
    normalizeAllRoutines();
    state.settings = state.settings || {};
    state.settings.lastSync = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    setSaved(true, 'Saved');
    if(showToast) toast('Saved');
  }catch(err){
    setSaved(false, 'Save failed');
    toast('Storage is full or unavailable. Please clear logs or free space.', true);
  }
}

function setSaved(ok, message){
  const dot = document.getElementById('savedDot');
  const text = document.getElementById('savedText');
  dot.className = `dot ${ok ? 'saved' : 'busy'}`;
  text.textContent = message;
}

function toast(msg, isError=false){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = isError ? '#9b1c1c' : '#18202a';
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

function wireTabs(){
  document.getElementById('tabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('.tab-btn');
    if(!btn) return;
    ui.activeTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('section.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`${ui.activeTab}Panel`).classList.add('active');
    renderActive();
  });
}

  if(!state.routines[date]) state.routines[date] = { id:`routine-${date}`, date, exercises:[], completionStatus:'none', notes:'' };
  const r = state.routines[date];
  r.exercises = Array.isArray(r.exercises) ? r.exercises.map(normalizeRoutineExercise) : [];
  r.completionStatus = computeCompletionStatus(r);
  return r;
}

function renderLog(){
  const panel = document.getElementById('logPanel');
  const current = new Date();
  current.setMonth(current.getMonth() + ui.monthOffset);
  const y = current.getFullYear();
  const m = current.getMonth();
  const first = new Date(y, m, 1);
  const last = endOfMonth(current);
  const monthName = current.toLocaleDateString(undefined, {month:'long', year:'numeric'});
  const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const startPad = first.getDay();
  const days = [];
  for(let i=0; i<startPad; i++) days.push(null);
  for(let d=1; d<=last.getDate(); d++) days.push(new Date(y, m, d));
  while(days.length % 7 !== 0) days.push(undefined);
  const routines = Object.values(state.routines).filter(r => r.date.startsWith(`${y}-${pad(m+1)}`));
  const stats = routines.reduce((acc, r) => { if(r.completionStatus === 'full') acc.full++; else if(r.completionStatus === 'partial') acc.partial++; else acc.none++; return acc; }, {full:0, partial:0, none:0});
  const streak = calcStreak();
  const selected = state.routines[ui.selectedLogDate];

  panel.innerHTML = `
    <div class="card">
      <div class="calendar-toolbar">
        <div>
          <h2 class="section-title">Log — ${monthName}</h2>
          <div class="subtle">Track routine completion, review past days, and export everything as CSV.</div>
        </div>
        <div class="inline-actions">
          <button class="btn secondary small" type="button" data-month-nav="-1">Previous</button>
          <button class="btn secondary small" type="button" data-month-nav="0">Current</button>
          <button class="btn secondary small" type="button" data-month-nav="1">Next</button>
          <button class="btn small" type="button" data-export-csv>Export Log as CSV</button>
        </div>
      </div>

      <div class="stats" style="margin-top:12px">
        <div class="stat"><div class="muted">Full completion</div><div class="num">${stats.full}</div></div>
        <div class="stat"><div class="muted">Partial completion</div><div class="num">${stats.partial}</div></div>
        <div class="stat"><div class="muted">No completion</div><div class="num">${stats.none}</div></div>
        <div class="stat"><div class="muted">Current streak</div><div class="num">${streak}</div></div>
      </div>

      <div class="calendar-grid" aria-label="Monthly calendar" style="margin-top:14px">
        ${weekdays.map(w => `<div class="day-head">${w}</div>`).join('')}
        ${days.map(d => {
          if(d === null || d === undefined) return `<div class="day-cell empty"></div>`;
          const iso = isoFromDate(d);
          const routine = state.routines[iso];
          let cls = 'empty';
          let body = '';
          if(routine){
            cls = routine.completionStatus || 'none';
            body = `<div class="muted">${routine.completionStatus === 'full' ? 'Full' : routine.completionStatus === 'partial' ? 'Partial' : 'None'}</div>`;
          }else{
            body = `<div class="muted">No log</div>`;
          }
          const selectedClass = ui.selectedLogDate === iso ? 'style="outline:3px solid var(--focus);outline-offset:1px"' : '';
          return `
            <div class="day-cell ${cls}" data-day="${iso}" ${selectedClass}>
              <div class="date">${d.getDate()}</div>
              ${body}
            </div>
          `;
        }).join('')}
      </div>

      <div class="selected-log">
        <div class="row spaced">
          <h3 class="section-title">Selected Day: ${escapeHtml(ui.selectedLogDate)}</h3>
          <span class="chip">${selected ? selected.completionStatus : 'No log'}</span>
        </div>
        ${selected ? renderSelectedLog(selected) : `<div class="subtle">No routine was logged for this date.</div>`}
      </div>

      <div class="section-block" style="margin-top:14px">
        <h3 class="section-title">Clear Old Logs</h3>
        <div class="row">
          <div style="min-width:220px" class="field">
            <label for="monthsToKeep">Keep last N months</label>
            <input id="monthsToKeep" type="number" min="1" step="1" value="6">
          </div>
          <button class="btn danger" type="button" data-clear-logs>Clear Old Logs</button>
        </div>
        <div class="footer-note">This keeps the most recent months and removes older logged days from localStorage.</div>
      </div>
    </div>
  `;
}

function renderSelectedLog(routine){
  const lines = routine.exercises.map(entry => {

    const done = (entry.completed || []).filter(Boolean).length;
    const total = entry.sets || 0;
    return `

        <strong>${escapeHtml(ex ? ex.name : 'Unknown exercise')}</strong>
        <div class="muted">${total} sets, ${entry.reps || 0} reps${entry.holdDuration ? `, ${entry.holdDuration}s hold${entry.holdRep ? ` on rep ${entry.holdRep}` : ''}` : ''} — ${done}/${total} sets completed</div>
      </li>
    `;
  }).join('');
  return `
    <div class="row" style="margin-bottom:8px">

      <span class="chip">${routine.exercises.length} exercises</span>
    </div>

function calcStreak(){
  let count = 0;
  let d = new Date();
  while(true){
    const iso = isoFromDate(d);
    const r = state.routines[iso];
    if(r && r.completionStatus === 'full') count++;
    else break;
    d.setDate(d.getDate()-1);
  }
  return count;
}

function onTodayChange(e){
  const cb = e.target.closest('input[type="checkbox"][data-today-date]');
  if(!cb) return;
  const date = cb.dataset.todayDate;
  const routine = getRoutine(date);
  const exId = cb.dataset.exerciseId;
  const setIndex = Number(cb.dataset.setIndex);
  const item = routine.exercises.find(x => x.exerciseId === exId);
  if(!item) return;
  item.completed[setIndex] = cb.checked;
  routine.completionStatus = computeCompletionStatus(routine);
  persist(false);
  renderToday();
  renderLog();
  updateTabBadge();
}

function onEditInput(e){}

function onEditChange(e){
  const field = e.target.closest('[data-routine-field]');
  if(field){
    const idx = Number(field.dataset.index);
    const routine = getRoutine(todayISO());
    const item = routine.exercises[idx];
    if(!item) return;
    const key = field.dataset.routineField;
    if(key === 'sets'){
      const newSets = Math.max(1, Number(field.value || 1));
      const oldCompleted = item.completed || [];
      item.sets = newSets;
      item.completed = Array.from({length:newSets}, (_, i) => Boolean(oldCompleted[i]));
    }else if(key === 'reps'){
      item.reps = Math.max(0, Number(field.value || 0));
    }else if(key === 'hasHold'){
      if(field.value === 'yes'){
        if(!item.holdDuration) item.holdDuration = 30;
        if(item.holdRep == null) item.holdRep = item.reps || 1;
      }else{
        item.holdDuration = 0;
        item.holdRep = null;
      }
    }else if(key === 'holdDuration'){
      item.holdDuration = Math.max(0, Number(field.value || 0));
    }else if(key === 'holdRep'){
      const v = Number(field.value);
      item.holdRep = Number.isFinite(v) && v > 0 ? v : null;
    }
    routine.completionStatus = computeCompletionStatus(routine);
    persist(false);
    renderEdit();
    renderToday();
    updateTabBadge();
  }
}

function onEditSubmit(e){
  const form = e.target.closest('#addExerciseForm');
  if(!form) return;
  e.preventDefault();
  const ex = readExerciseForm(form);
  if(!ex.name.trim()) return toast('Name is required.', true);
  if(!ex.category) return toast('Category is required.', true);
  if(!ex.description.trim()) return toast('Description is required.', true);
  const existsIdx = state.exercises.findIndex(x => x.id === ex.id);
  if(existsIdx >= 0){
    state.exercises[existsIdx] = ex;
    toast('Exercise updated');
  }else{
    state.exercises.unshift(ex);
    toast('Exercise added');
  }
  persist(false);
  form.reset();
  renderAll();
}

function onLogClick(e){
  const day = e.target.closest('[data-day]');
  if(day){
    ui.selectedLogDate = day.dataset.day;
    renderLog();
    return;
  }
  const nav = e.target.closest('[data-month-nav]');
  if(nav){
    const val = Number(nav.dataset.monthNav);
    ui.monthOffset = val === 0 ? 0 : ui.monthOffset + val;
    renderLog();
    return;
  }
  if(e.target.closest('[data-export-csv]')){ exportCsv(); return; }
  if(e.target.closest('[data-clear-logs]')){ clearOldLogs(); return; }
}

function clearOldLogs(){
  const months = Math.max(1, Number(document.getElementById('monthsToKeep').value || 6));
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - months);
  const cutoffIso = isoFromDate(cutoff);
  let removed = 0;
  Object.keys(state.routines).forEach(date => {
    if(date < cutoffIso){ delete state.routines[date]; removed++; }
  });
  persist(false);
  toast(`Removed ${removed} old log day(s).`);
  renderLog();
}

function exportCsv(){
  const rows = [['Date','Exercise','Category','Sets','Reps','Hold Duration (sec)','Hold Rep','Completed Sets','Completion Status','Notes']];
  Object.values(state.routines).sort((a,b) => a.date.localeCompare(b.date)).forEach(routine => {
    (routine.exercises || []).forEach(entry => {
      const ex = getExerciseById(entry.exerciseId) || {};
      const done = (entry.completed || []).filter(Boolean).length;
      rows.push([
        routine.date,
        ex.name || 'Unknown exercise',
        ex.category || '',
        entry.sets || 0,
        entry.reps || 0,
        entry.holdDuration || 0,
        entry.holdRep == null ? '' : entry.holdRep,
        `${done}/${entry.sets || 0}`,
        routine.completionStatus || computeCompletionStatus(routine),
        routine.notes || ''
      ]);
    });
  });
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pt-exercise-log-${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('CSV exported');
}

function onModalSubmit(e){
  e.preventDefault();
  const form = e.currentTarget;
  const ex = readExerciseForm(form);
  if(!ex.name.trim()) return toast('Name is required.', true);
  if(!ex.category) return toast('Category is required.', true);
  if(!ex.description.trim()) return toast('Description is required.', true);
  const existingIdx = state.exercises.findIndex(x => x.id === ex.id);
  if(existingIdx >= 0){
    state.exercises[existingIdx] = ex;
    toast('Exercise updated');
  }else{
    state.exercises.unshift(ex);
    toast('Exercise added');
  }
  persist(false);
  closeModal();
  renderAll();
}

function readExerciseForm(form){
  const data = new FormData(form);
  const name = String(data.get('name') || '').trim();
  const id = String(data.get('id') || '').trim() || slugify(name);
  const category = String(data.get('category') || 'Strength');
  const description = String(data.get('description') || '').trim();
  const drillDown = {
    whatToFeel: String(data.get('whatToFeel') || '').trim(),
    technique: splitLines(data.get('technique')),
    commonMistakes: splitLines(data.get('commonMistakes')),
    progression: String(data.get('progression') || '').trim(),
    notes: String(data.get('notes') || '').trim()
  };
  const tags = String(data.get('tags') || '').split(',').map(s => s.trim()).filter(Boolean);
  return { id, name, category, description, drillDown, tags };
}

function openModal(exerciseId){
  const ex = exerciseId ? state.exercises.find(x => x.id === exerciseId) : null;
  ui.editingId = ex ? ex.id : null;
  const form = document.getElementById('exerciseModalForm');
  form.reset();
  document.getElementById('modalTitle').textContent = ex ? 'Edit Exercise' : 'Add Exercise';
  form.elements.id.value = ex ? ex.id : '';
  form.elements.name.value = ex ? ex.name : '';
  form.elements.category.value = ex ? ex.category : 'Strength';
  form.elements.description.value = ex ? ex.description : '';
  form.elements.whatToFeel.value = ex?.drillDown?.whatToFeel || '';
  form.elements.technique.value = ex?.drillDown?.technique?.join('\n') || '';
  form.elements.commonMistakes.value = ex?.drillDown?.commonMistakes?.join('\n') || '';
  form.elements.progression.value = ex?.drillDown?.progression || '';
  form.elements.notes.value = ex?.drillDown?.notes || '';
  form.elements.tags.value = ex?.tags?.join(', ') || '';
  document.getElementById('modalBackdrop').classList.add('open');
  document.getElementById('modalBackdrop').setAttribute('aria-hidden','false');
  document.getElementById('modalName').focus();
}

function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('open');
  document.getElementById('modalBackdrop').setAttribute('aria-hidden','true');
}

function onAddToRoutine(){
  const select = document.getElementById('addExerciseSelect');
  const exId = select.value;
  const routine = getRoutine(todayISO());
  if(routine.exercises.some(x => x.exerciseId === exId)) return toast("That exercise is already in today's routine.");
  routine.exercises.push({ exerciseId: exId, sets:3, reps:10, holdDuration:0, holdRep:null, completed:[false,false,false] });
  routine.completionStatus = computeCompletionStatus(routine);
  persist(false);
  toast("Added to today's routine");
  renderEdit();
  renderToday();
  updateTabBadge();
}

function onSaveRoutine(){
  const routine = getRoutine(todayISO());
  if(!routine.exercises.length) return toast('Add at least one exercise before saving.', true);
  persist(true);
  toast('Routine saved');
}

function onEditPanelClick(e){
  const rem = e.target.closest('[data-remove-routine]');
  if(rem){
    const idx = Number(rem.dataset.removeRoutine);
    const routine = getRoutine(todayISO());
    routine.exercises.splice(idx,1);
    routine.completionStatus = computeCompletionStatus(routine);
    persist(false);
    renderEdit();
    renderToday();
    updateTabBadge();
    return;
  }
  const editBtn = e.target.closest('[data-edit-ex]');
  if(editBtn){ openModal(editBtn.dataset.editEx); return; }
  const delBtn = e.target.closest('[data-delete-ex]');
  if(delBtn){
    const id = delBtn.dataset.deleteEx;
    const ex = state.exercises.find(x => x.id === id);
    if(!confirm(`Delete "${ex?.name || 'this exercise'}" from the library?`)) return;
    state.exercises = state.exercises.filter(x => x.id !== id);
    Object.values(state.routines).forEach(r => {
      r.exercises = r.exercises.filter(item => item.exerciseId !== id);
      r.completionStatus = computeCompletionStatus(r);
    });
    persist(false);
    toast('Exercise deleted');
    renderAll();
    updateTabBadge();
    return;
  }
  if(e.target.closest('[data-add-to-routine]')){ onAddToRoutine(); return; }
  if(e.target.closest('[data-save-routine]')){ onSaveRoutine(); return; }
}

function onLibraryPanelClick(e){
  const toggle = e.target.closest('[data-library-toggle]');
  if(!toggle) return;
  const id = toggle.dataset.libraryToggle;
  const wrap = document.getElementById(`libGuideWrap-${id}`);
  if(wrap) wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
}

document.getElementById('editPanel').addEventListener('click', onEditPanelClick);
document.getElementById('libraryPanel').addEventListener('click', onLibraryPanelClick);
document.getElementById('todayPanel').addEventListener('click', (e)=>{
  const jump = e.target.closest('[data-jump-tab]');
  if(jump){
    ui.activeTab = jump.dataset.jumpTab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === ui.activeTab));
    document.querySelectorAll('section.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`${ui.activeTab}Panel`).classList.add('active');
    renderActive();
    return;
  }
  const guideBtn = e.target.closest('[data-today-guide]');
  if(guideBtn){
    const wrap = document.getElementById(`todayGuide-${guideBtn.dataset.todayGuide}`);
    if(wrap) wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
  }
});

function updateTabBadge(){
  const today = getRoutine(todayISO());
  const completed = (today.exercises || []).reduce((s, ex) => s + (ex.completed || []).filter(Boolean).length, 0);
  const total = (today.exercises || []).reduce((s, ex) => s + (ex.sets || 0), 0);
  const todayBtn = document.querySelector('.tab-btn[data-tab="today"]');
  todayBtn.textContent = total ? `Today (${completed}/${total})` : 'Today';
}
updateTabBadge();
</script>
</body>
</html>
